name: build feed
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build-feed.mjs
      - run: |
          git config user.name "skill-news[bot]"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --staged --quiet || (git commit -m "chore: update feed" && git push)
